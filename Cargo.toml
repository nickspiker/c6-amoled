[package]
autobins     = false
edition      = "2024"
name         = "c6-amoled"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "c6-amoled"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32c6", "unstable"] }

esp-rtos = { version = "0.4.0", features = ["embassy", "esp32c6", "esp-radio", "esp-alloc"] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6"] }

embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
esp-backtrace = { version = "0.20.0", features = [
  "esp32c6",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32c6"] }

critical-section = "1.2.0"
esp-storage      = { version = "0.10.0", features = ["esp32c6"] }
esp32c6          = "0.24"
blake3           = { version = "1", default-features = false }
esp-radio        = { version = "=1.0.0-beta.1", features = ["esp32c6", "wifi", "unstable"] }
esp-alloc        = { version = "0.11", features = ["esp32c6"] }
embassy-net      = { version = "0.9", default-features = false, features = ["tcp", "udp", "dhcpv4", "dhcpv4-hostname", "medium-ethernet", "proto-ipv4", "multicast"] }
embassy-sync     = "0.8"
edge-mdns        = "0.8"
edge-nal-embassy = { version = "0.9", default-features = false, features = ["proto-ipv4", "medium-ethernet", "udp", "multicast"] }
embedded-io-async = "0.7"
edge-nal         = "0.7"
embassy-futures  = "0.1"
heapless         = "0.9"
static_cell      = "2.1.1"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

# The radio blobs need optimisation to work (esp-radio's docs: opt-level 2 or 3).
[profile.release.package.esp-radio]
opt-level = 3
